<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1C20" />
      <stop offset="100%" stop-color="#0A0B0D" />
    </linearGradient>
    <linearGradient id="crimsonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D43833" />
      <stop offset="50%" stop-color="#B52B27" />
      <stop offset="100%" stop-color="#801815" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Badge with Dark Editorial Border -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="#B52B27" stroke-width="2.5" />
  
  <!-- Subtle Inner Grid / Matrix Accent Line -->
  <line x1="8" y1="16" x2="56" y2="16" stroke="#C81E1E" stroke-opacity="0.2" stroke-width="1" />
  <line x1="16" y1="8" x2="16" y2="56" stroke="#C81E1E" stroke-opacity="0.15" stroke-width="1" />

  <!-- Monogram 'P' - Bold, Architectural, Geometric -->
  <!-- Left Pillar Stem -->
  <path d="M16 14 H28 C37 14, 46 18, 46 27 C46 36, 37 40, 28 40 H23.5 V50 H16 Z" 
        fill="url(#crimsonGrad)" 
        filter="url(#glow)" />

  <!-- Inner Cutout of 'P' revealing Onyx Base -->
  <path d="M23.5 21 H27.5 C32 21, 37 23, 37 27 C37 31, 32 33, 27.5 33 H23.5 Z" 
        fill="#0D0E11" />

  <!-- High-Tech Architect Chevron / Dot Accent -->
  <polygon points="41,43 47,49 41,51 43,47" fill="#FF4444" />
  <circle cx="49" cy="49" r="2.5" fill="#FFFFFF" />
</svg>